<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile · RepairHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="../assets/css/app.css" />
</head>
<body>
  <main id="page-content" class="mx-auto max-w-3xl" hidden>
    <h1 class="text-2xl font-bold text-ink sm:text-3xl">Profile</h1>
    <p class="mt-1 text-slate-500">Customers see this when comparing quotes. Your categories decide which job requests you receive.</p>
    <div id="root" class="mt-6"></div>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/motion@12.43.0/dist/motion.js"></script>
  <script src="../assets/js/motion-fx.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/tech.js"></script>
  <script>
    (function () {
      const user = RH.layout.app({ active: 'profile', roles: ['technician'] });
      if (!user) return;
      const { html, setHTML } = RH.ui;
      let profile;
      let base = null;

      function locationText() {
        return base
          ? html`<span class="text-green-700"><i class="fa-solid fa-location-dot mr-1"></i>Set (${base.lat.toFixed(4)}, ${base.lng.toFixed(4)})</span>`
          : html`<span class="text-amber-700"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Not set. "Near my base location" on Job requests won't work until you set it.</span>`;
      }

      function render(groups) {
        const mine = new Set((profile.serviceCategoryIds || []).map(String));
        setHTML('root', html`<form id="profile-form" class="space-y-6" novalidate>
          <p data-form-error class="hidden rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700"></p>

          <section class="card space-y-4 p-5 sm:p-6">
            <h2 class="font-semibold text-ink">About you</h2>
            <div class="grid gap-4 sm:grid-cols-[1fr_160px]">
              <div><label for="serviceAreas" class="label">Service areas</label>
                <input id="serviceAreas" name="serviceAreas" class="input" value="${(profile.serviceAreas || []).join(', ')}" placeholder="e.g. Egbeda, Ikeja, Alimosho" />
                <p class="mt-1 text-xs text-slate-500">Separate areas with commas. Shown to customers on your quotes.</p></div>
              <div><label for="experienceYears" class="label">Years of experience</label>
                <input id="experienceYears" name="experienceYears" type="number" min="0" max="60" class="input" value="${profile.experienceYears ?? ''}" /></div>
            </div>
            <div><label for="bio" class="label">Bio</label>
              <textarea id="bio" name="bio" rows="3" maxlength="1000" class="input resize-y" placeholder="What you repair, certifications, how you work">${profile.bio || ''}</textarea></div>
            <label class="flex items-center gap-3 text-sm text-ink">
              <input id="isAvailable" name="isAvailable" type="checkbox" class="h-4 w-4 rounded border-slate-300 text-brand-600" ${profile.isAvailable !== false ? RH.ui.raw('checked') : ''} />
              Available for new jobs <span class="text-slate-500">(you're notified about new requests only while available)</span>
            </label>
          </section>

          <section class="card p-5 sm:p-6">
            <h2 class="font-semibold text-ink">Service categories</h2>
            <p class="mt-1 text-sm text-slate-500">You'll see requests in the categories you tick. Requests are filed under a specific issue type, so ticking a category also ticks its issue types. Leave everything unticked to see all requests.</p>
            <div class="mt-4 grid gap-4 sm:grid-cols-2">
              ${groups.map((g) => html`<fieldset class="rounded-xl border border-slate-200 p-4">
                <label class="flex items-center gap-2 font-medium text-ink"><input type="checkbox" data-parent="${g._id}" value="${g._id}" class="h-4 w-4 rounded border-slate-300 text-brand-600" ${mine.has(String(g._id)) ? RH.ui.raw('checked') : ''} />${g.name}</label>
                ${g.children.length
                  ? html`<div class="mt-2 space-y-1.5 pl-6">${g.children.map((c) => html`<label class="flex items-center gap-2 text-sm text-slate-600"><input type="checkbox" data-child-of="${g._id}" value="${c._id}" class="h-4 w-4 rounded border-slate-300 text-brand-600" ${mine.has(String(c._id)) ? RH.ui.raw('checked') : ''} />${c.name}</label>`)}</div>`
                  : ''}
              </fieldset>`)}
            </div>
          </section>

          <section class="card p-5 sm:p-6">
            <h2 class="font-semibold text-ink">Base location</h2>
            <p class="mt-1 text-sm text-slate-500">Your workshop or where you usually start from. Used to find job requests near you.</p>
            <p id="base-status" class="mt-3 text-sm">${locationText()}</p>
            <button type="button" id="use-location" class="btn-outline btn-sm mt-3"><i class="fa-solid fa-location-crosshairs"></i>Use my current location</button>
          </section>

          <div class="flex justify-end"><button type="submit" class="btn-primary">Save profile</button></div>
        </form>`);

        const form = document.getElementById('profile-form');
        form.querySelectorAll('[data-parent]').forEach((p) => p.addEventListener('change', () => {
          form.querySelectorAll(`[data-child-of="${p.value}"]`).forEach((c) => (c.checked = p.checked));
        }));

        document.getElementById('use-location').addEventListener('click', async (e) => {
          await RH.ui.withLoading(e.currentTarget, async () => {
            try {
              base = await RH.tech.currentLocation();
              setHTML('base-status', html`${locationText()} <span class="text-slate-500">· click Save profile to keep it</span>`);
            } catch (err) {
              RH.ui.toast(err.message, 'error');
            }
          }, 'Locating…');
        });

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          RH.ui.clearErrors(form);
          const ids = [...form.querySelectorAll('[data-parent]:checked, [data-child-of]:checked')].map((i) => i.value);
          if (ids.length > 30) return RH.ui.toast('Choose at most 30 categories.', 'error');
          const areas = form.serviceAreas.value.split(',').map((a) => a.trim()).filter(Boolean);
          if (areas.length > 30) return RH.ui.fieldError(form, 'serviceAreas', 'List at most 30 areas.');
          const body = { serviceAreas: areas, serviceCategoryIds: ids, isAvailable: form.isAvailable.checked };
          if (form.bio.value.trim()) body.bio = form.bio.value.trim(); // the API rejects an empty bio
          if (form.experienceYears.value !== '') body.experienceYears = Number(form.experienceYears.value);
          if (base) body.baseLocation = base;
          await RH.ui.withLoading(form.querySelector('[type=submit]'), async () => {
            try {
              const { data } = await RH.api.technicians.update(profile._id, body);
              profile = data;
              RH.ui.toast('Profile saved.', 'success');
            } catch (err) {
              RH.ui.showFormError(form, err);
            }
          }, 'Saving…');
        });
      }

      Promise.all([RH.tech.profile(), RH.data.categoryTree()])
        .then(([p, groups]) => {
          profile = p;
          base = RH.tech.point(p.baseLocation);
          render(groups);
        })
        .catch((e) => setHTML('root', RH.ui.errorState(e.message, true)));
    })();
  </script>
</body>
</html>
