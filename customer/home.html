<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home · RepairHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="../assets/css/app.css" />
</head>
<body>
  <main id="page-content" class="mx-auto max-w-6xl" hidden>
    <section class="flex flex-col gap-4 rounded-2xl bg-brand-600 p-6 text-white sm:flex-row sm:items-center sm:justify-between lg:p-8">
      <div>
        <h1 id="greeting" class="text-2xl font-bold lg:text-3xl">Welcome</h1>
        <p class="mt-1 text-brand-100">What needs fixing today? Pick a category to get quotes from verified technicians.</p>
      </div>
      <a href="request-repair.html" class="btn shrink-0 bg-white text-brand-700 hover:bg-brand-50"><i class="fa-solid fa-plus"></i>Request a repair</a>
    </section>

    <section class="mt-8">
      <h2 class="text-lg font-semibold text-ink">Choose a category</h2>
      <div id="categories" class="mt-4"></div>
    </section>

    <section class="mt-8">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-semibold text-ink">Your active repairs</h2>
        <a href="my-repairs.html" class="text-sm font-medium text-brand-600 hover:underline">View all</a>
      </div>
      <div id="active" class="mt-4"></div>
    </section>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/motion@12.43.0/dist/motion.js"></script>
  <script src="../assets/js/motion-fx.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="home.js"></script>
</body>
</html>
