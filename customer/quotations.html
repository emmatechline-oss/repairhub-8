<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repair quotations · RepairHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="../assets/css/app.css" />
</head>
<body>
  <main id="page-content" class="mx-auto max-w-6xl" hidden>
    <a href="my-repairs.html" class="inline-flex items-center gap-2 text-sm text-slate-600 hover:text-ink"><i class="fa-solid fa-arrow-left"></i>Back to My Repairs</a>

    <div class="mt-4 grid gap-6 lg:grid-cols-[1fr_320px]">
      <div class="min-w-0">
        <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
          <div>
            <h1 class="text-2xl font-bold text-ink">Repair quotations</h1>
            <p id="count" class="mt-1 text-slate-500">&nbsp;</p>
          </div>
          <label class="flex items-center gap-2 text-sm text-slate-600">Sort by
            <select id="sort" class="input w-auto py-2">
              <option value="price">Lowest price</option>
              <option value="value">Best value</option>
              <option value="rating">Highest rating</option>
              <option value="eta">Fastest repair</option>
            </select>
          </label>
        </div>
        <div id="banner" class="mt-4"></div>
        <div id="list" class="mt-4 space-y-4"></div>
      </div>

      <aside class="space-y-4">
        <div class="card p-5">
          <h2 class="font-semibold text-ink">Repair request</h2>
          <div id="request" class="mt-4"></div>
        </div>
        <div class="card-soft flex gap-3 p-5">
          <i class="fa-solid fa-shield-halved mt-0.5 text-brand-600"></i>
          <p class="text-xs text-slate-600">Payments are held safely in escrow and only released to the technician after you confirm the repair is done.</p>
        </div>
      </aside>
    </div>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/motion@12.43.0/dist/motion.js"></script>
  <script src="../assets/js/motion-fx.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="quotations.js"></script>
</body>
</html>
