<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wallet · RepairHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="../assets/css/app.css" />
</head>
<body>
  <main id="page-content" class="mx-auto max-w-4xl" hidden>
    <h1 class="text-2xl font-bold text-ink sm:text-3xl">Wallet</h1>
    <p class="mt-1 text-slate-500">Pay for repairs from your balance. Refunds from cancelled bookings and disputes are added here.</p>

    <div class="mt-6 grid gap-4 md:grid-cols-[1fr_1.2fr]">
      <section class="rounded-2xl bg-brand-600 p-6 text-white">
        <p class="text-sm text-brand-100">Available balance</p>
        <p id="balance" class="mt-1 text-4xl font-bold">—</p>
        <p class="mt-4 text-xs text-brand-100"><i class="fa-solid fa-shield-halved mr-1"></i>Payments from your wallet are held in escrow until you confirm the repair.</p>
      </section>

      <form id="topup-form" class="card space-y-4 p-6" novalidate>
        <h2 class="font-semibold text-ink">Top up</h2>
        <p data-form-error class="hidden rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700"></p>
        <div class="flex flex-wrap gap-2" id="quick"></div>
        <div><label for="amount" class="label">Amount (₦)</label>
          <input id="amount" name="amount" type="number" min="100" max="5000000" step="100" class="input" placeholder="e.g. 20000" /></div>
        <button type="submit" class="btn-primary w-full"><i class="fa-solid fa-credit-card"></i>Top up with card or bank</button>
        <p class="text-center text-xs text-slate-500">Secure checkout by Paystack · ₦100 to ₦5,000,000</p>
      </form>
    </div>

    <section class="mt-8">
      <h2 class="font-semibold text-ink">Transactions</h2>
      <div id="txns" class="mt-3"></div>
      <div id="pager"></div>
    </section>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/motion@12.43.0/dist/motion.js"></script>
  <script src="../assets/js/motion-fx.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    (function () {
      const user = RH.layout.app({ active: 'wallet', roles: ['customer'] });
      if (!user) return;
      const { html, setHTML } = RH.ui;
      const form = document.getElementById('topup-form');
      let page = 1;

      const TYPES = {
        topup: ['Wallet top-up', 'fa-plus', 'text-green-600', '+'],
        refund: ['Refund', 'fa-rotate-left', 'text-green-600', '+'],
        escrow_payment: ['Repair payment', 'fa-lock', 'text-slate-700', '−'],
      };
      const STATUS = { pending: ['Pending', 'amber'], success: ['Done', 'green'], failed: ['Failed', 'red'], rejected: ['Rejected', 'red'] };

      setHTML('quick', [5000, 10000, 20000, 50000].map((n) => html`<button type="button" data-amt="${n}" class="chip">${RH.ui.money(n)}</button>`));
      document.querySelectorAll('[data-amt]').forEach((b) => b.addEventListener('click', () => (form.amount.value = b.dataset.amt)));

      async function loadBalance() {
        try {
          const { data } = await RH.api.wallet.me();
          document.getElementById('balance').textContent = RH.ui.money(data.balance);
        } catch (e) {
          document.getElementById('balance').textContent = '—';
          RH.ui.toast(e.message, 'error');
        }
      }

      async function loadTxns() {
        setHTML('txns', RH.ui.spinner());
        setHTML('pager', '');
        try {
          const res = await RH.api.wallet.transactions({ page, limit: 15 });
          if (!res.data.length) {
            setHTML('txns', RH.ui.emptyState('fa-receipt', 'No transactions yet', 'Top-ups, repair payments and refunds will show here.'));
            return;
          }
          setHTML('txns', html`<div class="card divide-y divide-slate-100 px-5">${res.data.map((t) => {
            const [label, icon, color, sign] = TYPES[t.type] || [t.type.replace(/_/g, ' '), 'fa-circle', 'text-slate-600', ''];
            const [sLabel, sTone] = STATUS[t.status] || [t.status, 'slate'];
            const via = t.gateway === 'paystack' ? 'Card / bank' : t.gateway === 'wallet' ? 'Wallet' : '';
            return html`<div class="flex items-center gap-4 py-3">
              <span class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-slate-50 ${color}"><i class="fa-solid ${icon} text-sm"></i></span>
              <div class="min-w-0 flex-1"><p class="text-sm font-medium text-ink">${label}${via ? html` <span class="font-normal text-slate-400">· ${via}</span>` : ''}</p>
                <p class="truncate text-xs text-slate-500">${RH.ui.dateTime(t.createdAt)}${t.note ? ` · ${t.note}` : ''}</p></div>
              <div class="text-right"><p class="font-semibold ${color}">${sign}${RH.ui.money(t.amount)}</p>${RH.ui.toneBadge(sLabel, sTone)}</div>
              ${t.status === 'pending' && t.gateway === 'paystack'
                ? html`<a href="${RH.url('customer/payment-callback.html', { reference: t.reference })}" class="btn-ghost btn-sm" title="Check payment status"><i class="fa-solid fa-rotate"></i></a>`
                : ''}
            </div>`;
          })}</div>`);
          setHTML('pager', RH.ui.pager(res.meta));
          document.querySelectorAll('#pager [data-page]').forEach((b) => b.addEventListener('click', () => { page = Number(b.dataset.page); loadTxns(); }));
        } catch (e) {
          setHTML('txns', RH.ui.errorState(e.message, true));
        }
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        RH.ui.clearErrors(form);
        const amount = Math.floor(Number(form.amount.value));
        if (!amount || amount < 100 || amount > 5000000) return RH.ui.fieldError(form, 'amount', 'Enter an amount between ₦100 and ₦5,000,000.');
        await RH.ui.withLoading(form.querySelector('[type=submit]'), async () => {
          try {
            const { data } = await RH.api.payments.topup(amount);
            try { sessionStorage.setItem('rh_pending_payment', JSON.stringify({ reference: data.reference, topup: true })); } catch (err) { /* ignore */ }
            // PAYSTACK_MOCK on the server returns a fake checkout URL; go straight to verification.
            if (/paystack\.test/.test(data.authorizationUrl)) RH.go('customer/payment-callback.html', { reference: data.reference });
            else location.href = data.authorizationUrl;
          } catch (err) {
            RH.ui.showFormError(form, err);
          }
        }, 'Opening checkout…');
      });

      loadBalance();
      loadTxns();
    })();
  </script>
</body>
</html>
