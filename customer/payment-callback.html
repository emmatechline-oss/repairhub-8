<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirming payment · RepairHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="../assets/css/app.css" />
</head>
<body>
  <!-- Paystack redirects here after checkout (set the API's PAYSTACK_CALLBACK_URL to this page). -->
  <main id="page-content" class="mx-auto max-w-xl" hidden>
    <div id="root" class="mt-10"></div>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/motion@12.43.0/dist/motion.js"></script>
  <script src="../assets/js/motion-fx.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    (function () {
      const user = RH.layout.app({ active: 'repairs' });
      if (!user) return;
      const { html, setHTML } = RH.ui;

      let pending = null;
      try { pending = JSON.parse(sessionStorage.getItem('rh_pending_payment')); } catch (e) { /* ignore */ }
      const reference = RH.param('reference') || RH.param('trxref') || (pending && pending.reference);

      function state(icon, tone, title, text, actions) {
        setHTML('root', html`<div class="card flex flex-col items-center gap-3 px-6 py-12 text-center">
          <span class="inline-flex h-16 w-16 items-center justify-center rounded-full ${tone} text-2xl"><i class="fa-solid ${icon}"></i></span>
          <h1 class="text-xl font-bold text-ink">${title}</h1>
          <p class="max-w-sm text-sm text-slate-600">${text}</p>
          <div class="mt-3 flex flex-wrap justify-center gap-3">${actions}</div>
        </div>`);
      }

      async function verify() {
        if (!reference) {
          return state('fa-question', 'bg-slate-100 text-slate-500', 'No payment to confirm', 'We could not find a payment reference.',
            html`<a class="btn-primary btn-sm" href="${RH.url('customer/my-repairs.html')}">Go to My Repairs</a>`);
        }
        setHTML('root', RH.ui.spinner('Confirming your payment…'));
        try {
          const { data: txn } = await RH.api.payments.verify(reference);
          const jobId = txn.repairJobId || (pending && pending.jobId);
          const isTopup = txn.type === 'topup';
          if (txn.status === 'success') {
            try { sessionStorage.removeItem('rh_pending_payment'); } catch (e) { /* ignore */ }
            if (isTopup) {
              RH.flash(`Wallet topped up with ${RH.ui.money(txn.amount)}.`);
              return RH.go('customer/wallet.html');
            }
            RH.flash('Payment successful. Funds are held in escrow.');
            return RH.go('customer/booking-confirmed.html', { job: jobId });
          }
          if (txn.status === 'pending') {
            return state('fa-hourglass-half', 'bg-amber-50 text-amber-600', 'Payment still processing',
              "Paystack hasn't confirmed this payment yet. This can take a moment.",
              html`<button id="retry" class="btn-primary btn-sm">Check again</button>
                ${isTopup ? html`<a class="btn-outline btn-sm" href="${RH.url('customer/wallet.html')}">Back to wallet</a>` : jobId ? html`<a class="btn-outline btn-sm" href="${RH.url('customer/repair-details.html', { job: jobId })}">View repair</a>` : ''}`);
          }
          return state('fa-xmark', 'bg-red-50 text-red-600', 'Payment failed', txn.note || 'The payment was not completed. You can try again.',
            isTopup ? html`<a class="btn-primary btn-sm" href="${RH.url('customer/wallet.html')}">Back to wallet</a>` : jobId ? html`<a class="btn-primary btn-sm" href="${RH.url('customer/payment.html', { job: jobId })}">Try again</a>` : '');
        } catch (e) {
          state('fa-triangle-exclamation', 'bg-red-50 text-red-600', 'Could not confirm payment', e.message, html`<button id="retry" class="btn-primary btn-sm">Try again</button>`);
        } finally {
          const retry = document.getElementById('retry');
          if (retry) retry.addEventListener('click', verify);
        }
      }
      verify();
    })();
  </script>
</body>
</html>
