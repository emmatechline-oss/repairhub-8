<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request submitted · RepairHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../assets/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="../assets/css/app.css" />
</head>
<body>
  <main id="page-content" class="mx-auto max-w-6xl" hidden>
    <div id="root">
    </div>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/motion@12.43.0/dist/motion.js"></script>
  <script src="../assets/js/motion-fx.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/data.js"></script>
  <script>
    (function () {
      const user = RH.layout.app({ active: 'repairs' });
      if (!user) return;
      const { html, setHTML } = RH.ui;
      const id = RH.param('id');

      const STEPS = [
        ['Request submitted', 'Your request has been received.'],
        ['Finding technicians', "We're notifying qualified technicians."],
        ['Quotations received', "You'll receive offers from technicians shortly."],
        ['Technician selected', 'Choose a technician and proceed to booking.'],
      ];
      // How far along the 4 steps a request is.
      const REACHED = { open: 2, quoted: 3, booked: 4, in_progress: 4, completed: 4 };

      function render(r) {
        const reached = REACHED[r.status] || 1;
        const cat = r.serviceCategoryId && r.serviceCategoryId.name;
        const kv = (k, v) => html`<div class="flex justify-between gap-4 py-2 text-sm"><span class="text-slate-500">${k}</span><span class="text-right font-medium text-ink">${v || '—'}</span></div>`;

        setHTML('root', html`<div class="grid gap-6 lg:grid-cols-[1fr_320px]">
          <section class="text-center">
            <div data-celebrate class="mx-auto w-fit">${RH.ui.slotImage(RH.images.requestSuccess, "Request submitted", "mx-auto mt-4 h-32 w-auto", html`<span class="mx-auto mt-4 inline-flex h-24 w-24 items-center justify-center rounded-full bg-green-100 text-5xl text-green-600"><i class="fa-solid fa-check"></i></span>`)}</div>
            <h1 class="mt-6 text-2xl font-bold text-ink sm:text-3xl">Repair request has been submitted!</h1>
            <p class="mx-auto mt-2 max-w-lg text-slate-600">Your request has been sent to technicians who match your repair needs. We'll notify you when technicians respond with their quotations.</p>

            <div class="card-soft mx-auto mt-8 flex max-w-2xl flex-col gap-4 p-5 text-left sm:flex-row sm:items-center">
              ${RH.ui.deviceTile(r.itemType || cat)}
              <div class="min-w-0 flex-1">
                <p class="font-semibold text-ink">${RH.data.requestTitle(r)}</p>
                <p class="text-xs text-slate-500">${[r.brandModel, cat].filter(Boolean).join(' · ')}</p>
              </div>
              <div class="grid grid-cols-2 gap-4 text-sm sm:text-right">
                <div><p class="text-xs text-slate-500">Submitted</p><p class="font-semibold text-ink">${RH.ui.dateTime(r.createdAt)}</p></div>
                <div><p class="text-xs text-slate-500">Request ID</p><p class="font-semibold text-ink">${RH.ui.ref(r._id)}</p></div>
              </div>
            </div>

            <ol class="mx-auto mt-10 grid max-w-2xl grid-cols-2 gap-6 sm:grid-cols-4">
              ${STEPS.map(([label, hint], i) => {
                const done = i + 1 < reached || (i + 1 === reached && reached === 4);
                const current = i + 1 === reached && !done;
                return html`<li class="flex flex-col items-center text-center">
                  <span class="inline-flex h-8 w-8 items-center justify-center rounded-full text-sm font-semibold ${
                    done ? 'bg-brand-600 text-white' : current ? 'border-2 border-brand-600 text-brand-600' : 'border border-slate-300 text-slate-400'
                  }">${done ? html`<i class="fa-solid fa-check"></i>` : i + 1}</span>
                  <p class="mt-2 text-sm font-semibold ${done || current ? 'text-brand-600' : 'text-slate-500'}">${label}</p>
                  <p class="mt-1 text-xs text-slate-500">${hint}</p>
                </li>`;
              })}
            </ol>

            <div class="mx-auto mt-10 flex max-w-sm flex-col gap-3">
              <a href="${RH.url('customer/quotations.html', { request: r._id })}" class="btn-primary">View quotations <i class="fa-solid fa-arrow-right"></i></a>
              <a href="${RH.url('customer/home.html')}" class="btn-outline">Back to Home</a>
            </div>
          </section>

          <aside class="space-y-4">
            <div class="card p-5">
              <h2 class="font-semibold text-ink">Request summary</h2>
              <div class="mt-3 divide-y divide-slate-100">
                ${kv('Category', cat)}
                ${kv('Device', r.itemType)}
                ${kv('Brand & model', r.brandModel)}
                ${kv('Urgency', r.urgency && r.urgency[0].toUpperCase() + r.urgency.slice(1))}
                ${kv('Address', r.address)}
                ${kv('Status', RH.ui.statusLabel(r.status))}
              </div>
            </div>
            <div class="card-soft p-5">
              <p class="flex items-center gap-2 font-semibold text-ink"><i class="fa-regular fa-clock text-brand-600"></i>What happens next</p>
              <ol class="mt-3 space-y-2 text-xs text-slate-600">
                <li class="flex gap-2"><span class="inline-flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-brand-600 text-[10px] text-white">1</span>We'll match your request with trusted technicians.</li>
                <li class="flex gap-2"><span class="inline-flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-brand-600 text-[10px] text-white">2</span>You'll receive quotations from interested technicians.</li>
                <li class="flex gap-2"><span class="inline-flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-brand-600 text-[10px] text-white">3</span>Review the offers, choose a technician and proceed to booking.</li>
              </ol>
            </div>
            <div class="card-soft p-5">
              <p class="flex items-center gap-2 font-semibold text-brand-700"><i class="fa-solid fa-bell"></i>You'll be notified</p>
              <p class="mt-1 text-xs text-slate-600">We'll send you an in-app notification when you receive new quotations.</p>
            </div>
          </aside>
        </div>`);
      }

      if (!id) {
        setHTML('root', RH.ui.errorState('No repair request was specified.'));
        return;
      }
      setHTML('root', RH.ui.spinner());
      RH.api.repairRequests
        .get(id)
        .then(({ data }) => render(data))
        .catch((e) => setHTML('root', RH.ui.errorState(e.message, true)));
    })();
  </script>
</body>
</html>
